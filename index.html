<body>

  <header class="app-header">
    <div class="container header-container">
      <div class="brand-logo">
        <svg class="brand-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g fill="#009FE3">
            <path d="M 44,23 L 44,31 L 18,44 L 11,40 L 11,38 Z" />

        </svg>
        <div class="brand-text">
          <span class="brand-sub">&lt;residência&gt;</span>
          <span class="brand-main">Full Stack <strong>5.0</strong></span>
        </div>
      </div>

      <div class="header-badge">
        <span class="status-dot"></span>
        Desenvolvedores • 14 Devs
      </div>
    </div>
  </header>

  <section class="hero-section">
    <div class="container hero-content">
      <span class="section-tag">Especialistas</span>
      <h1 class="hero-title">Equipe de Talentos</h1>
      <p class="hero-desc">Conheça os desenvolvedores responsáveis pela modelagem de dados, arquitetura de sistemas, construção de APIs e interfaces da Residência.</p>

      <div class="controls-panel">
        <div class="search-input-wrapper">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" placeholder="Filtrar por dev, especialidade ou stack (Java, React, SQL, Docker)..." autocomplete="off">
        </div>

        <div class="filter-chips">
          <button class="chip active" data-filter="all">Todos (14)</button>
          <button class="chip" data-filter="frontend">Front-end</button>
          <button class="chip" data-filter="backend">Back-end</button>
          <button class="chip" data-filter="data">Dados & SQL</button>
          <button class="chip" data-filter="infra-qa">DevOps, QA & Sec</button>
        </div>
      </div>
    </div>
  </section>

  <main class="container main-content">
    <div id="team-grid" class="team-grid" aria-live="polite"></div>
  </main>

  <footer class="app-footer">
    <div class="container footer-content">

        <h3 class="member-name"></h3>
